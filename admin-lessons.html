<script>


const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


let currentUser = null;

let courseId = null;


/*
================================
INITIALIZE
================================
*/

async function init() {


    const {
        data
    } =
    await supabaseClient.auth
        .getUser();


    currentUser =
        data.user;


    if (!currentUser) {

        location.href =
            "login.html";

        return;

    }


    const profile =
        await supabaseClient

            .from("profiles")

            .select("role")

            .eq(
                "id",
                currentUser.id
            )

            .single();


    if (
        !profile.data ||
        profile.data.role !== "admin"
    ) {

        location.href =
            "student-dashboard.html";

        return;

    }


    courseId =
        new URLSearchParams(
            location.search
        ).get("course_id");


    if (!courseId) {

        alert(
            "Course ID missing."
        );

        location.href =
            "admin.html";

        return;

    }


    await loadCourse();

    await loadLessons();

}


/*
================================
LOAD COURSE
================================
*/

async function loadCourse() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("courses")

        .select(
            "title"
        )

        .eq(
            "id",
            courseId
        )

        .single();


    if (error || !data) {

        alert(
            "Course not found."
        );

        location.href =
            "admin.html";

        return;

    }


    document.getElementById(
        "courseTitle"
    ).textContent =
        data.title;

}


/*
================================
LOAD LESSONS
================================
*/

async function loadLessons() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("lessons")

        .select("*")

        .eq(
            "course_id",
            courseId
        )

        .order(
            "lesson_order",
            {
                ascending:true
            }
        );


    const container =
        document.getElementById(
            "lessons"
        );


    if (error) {

        container.textContent =
            error.message;

        return;

    }


    if (!data || !data.length) {

        container.innerHTML = `

            <p style="
                color:var(--muted)
            ">

                No lessons yet.
                Click "Add Lesson" to create one.

            </p>

        `;

        return;

    }


    container.innerHTML =

        data.map(
            lesson => `

            <article class="lesson">

                <div class="lesson-top">

                    <div>

                        <div
                        class="lesson-title">

                            ${lesson.lesson_order}.
                            ${escapeHTML(
                                lesson.title
                            )}

                        </div>


                        <div
                        class="lesson-description">

                            ${escapeHTML(
                                lesson.description || ""
                            )}

                        </div>

                    </div>


                    <span class="badge">

                        ${
                            lesson.published
                            ? "Published"
                            : "Draft"
                        }

                    </span>

                </div>


                <div class="actions">

                    <button
                    class="btn btn-outline"
                    onclick='editLesson(
                        ${JSON.stringify(
                            lesson
                        )}
                    )'>

                        Edit

                    </button>


                    <button
                    class="btn btn-outline"
                    onclick="toggleLesson(
                        ${lesson.id},
                        ${lesson.published}
                    )">

                        ${
                            lesson.published
                            ? "Unpublish"
                            : "Publish"
                        }

                    </button>


                    <button
                    class="btn btn-danger"
                    onclick="deleteLesson(
                        ${lesson.id}
                    )">

                        Delete

                    </button>

                </div>

            </article>

            `
        ).join("");

}


/*
================================
SHOW FORM
================================
*/

function showForm() {


    document.getElementById(
        "lessonForm"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "formTitle"
    ).textContent =
        "New Lesson";


    document.getElementById(
        "lessonId"
    ).value = "";


    document.getElementById(
        "title"
    ).value = "";


    document.getElementById(
        "description"
    ).value = "";


    document.getElementById(
        "content"
    ).value = "";


    document.getElementById(
        "videoUrl"
    ).value = "";


    document.getElementById(
        "lessonOrder"
    ).value = "1";


    document.getElementById(
        "published"
    ).checked = true;

}


/*
================================
HIDE FORM
================================
*/

function hideForm() {

    document.getElementById(
        "lessonForm"
    ).classList.add(
        "hidden"
    );

}


/*
================================
EDIT LESSON
================================
*/

function editLesson(
    lesson
) {


    showForm();


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Lesson";


    document.getElementById(
        "lessonId"
    ).value =
        lesson.id;


    document.getElementById(
        "title"
    ).value =
        lesson.title || "";


    document.getElementById(
        "description"
    ).value =
        lesson.description || "";


    document.getElementById(
        "content"
    ).value =
        lesson.content || "";


    document.getElementById(
        "videoUrl"
    ).value =
        lesson.video_url || "";


    document.getElementById(
        "lessonOrder"
    ).value =
        lesson.lesson_order || 1;


    document.getElementById(
        "published"
    ).checked =
        lesson.published;

}


/*
================================
SAVE LESSON
================================
*/

async function saveLesson(
    event
) {


    event.preventDefault();


    const id =
        document.getElementById(
            "lessonId"
        ).value;


    const lesson = {

        course_id:
            Number(courseId),

        title:
            document.getElementById(
                "title"
            ).value.trim(),

        description:
            document.getElementById(
                "description"
            ).value.trim(),

        content:
            document.getElementById(
                "content"
            ).value.trim(),

        video_url:
            document.getElementById(
                "videoUrl"
            ).value.trim() || null,

        lesson_order:
            Number(
                document.getElementById(
                    "lessonOrder"
                ).value
            ),

        published:
            document.getElementById(
                "published"
            ).checked

    };


    let response;


    if (id) {

        response =
            await supabaseClient

                .from("lessons")

                .update(lesson)

                .eq(
                    "id",
                    id
                );

    } else {

        response =
            await supabaseClient

                .from("lessons")

                .insert(
                    lesson
                );

    }


    const message =
        document.getElementById(
            "message"
        );


    if (response.error) {

        message.className =
            "message error";

        message.textContent =
            response.error.message;

        return;

    }


    message.className =
        "message success";


    message.textContent =
        "✓ Lesson saved successfully.";


    await loadLessons();


    setTimeout(
        hideForm,
        700
    );

}


/*
================================
TOGGLE PUBLISHED
================================
*/

async function toggleLesson(
    id,
    currentStatus
) {


    const {
        error
    } =
    await supabaseClient

        .from("lessons")

        .update({

            published:
                !currentStatus

        })

        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadLessons();

}


/*
================================
DELETE
================================
*/

async function deleteLesson(
    id
) {


    if (
        !confirm(
            "Delete this lesson?"
        )
    ) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from("lessons")

        .delete()

        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadLessons();

}


/*
================================
ESCAPE HTML
================================
*/

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


init();

</script>

</body>

</html>
