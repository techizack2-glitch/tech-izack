<script>


const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


let currentUser = null;


/*
================================
AUTH + ADMIN CHECK
================================
*/

async function init() {


    const {
        data
    } =
    await supabaseClient.auth
        .getUser();


    currentUser =
        data.user;


    if (!currentUser) {

        location.href =
            "login.html";

        return;

    }


    const {
        data: profile,
        error
    } =
    await supabaseClient

        .from("profiles")

        .select("role")

        .eq(
            "id",
            currentUser.id
        )

        .single();


    if (
        error ||
        !profile ||
        profile.role !== "admin"
    ) {

        document.body.innerHTML = `

            <div style="
                color:white;
                text-align:center;
                padding:120px 20px;
            ">

                <h1>
                    Access Denied
                </h1>

                <p>
                    Admin privileges are required.
                </p>

                <a
                href="student-dashboard.html"
                class="btn btn-primary">

                    Back to Dashboard

                </a>

            </div>

        `;

        return;

    }


    await loadStats();

    await loadCourses();

}


/*
================================
LOAD STATS
================================
*/

async function loadStats() {


    const courses =
        await supabaseClient

            .from("courses")

            .select(
                "id",
                {
                    count:"exact",
                    head:true
                }
            );


    const lessons =
        await supabaseClient

            .from("lessons")

            .select(
                "id",
                {
                    count:"exact",
                    head:true
                }
            );


    const labs =
        await supabaseClient

            .from("labs")

            .select(
                "id",
                {
                    count:"exact",
                    head:true
                }
            );


    const students =
        await supabaseClient

            .from("profiles")

            .select(
                "id",
                {
                    count:"exact",
                    head:true
                }
            )

            .eq(
                "role",
                "student"
            );


    document.getElementById(
        "courseCount"
    ).textContent =
        courses.count || 0;


    document.getElementById(
        "lessonCount"
    ).textContent =
        lessons.count || 0;


    document.getElementById(
        "labCount"
    ).textContent =
        labs.count || 0;


    document.getElementById(
        "studentCount"
    ).textContent =
        students.count || 0;

}


/*
================================
LOAD COURSES
================================
*/

async function loadCourses() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("courses")

        .select("*")

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    const container =
        document.getElementById(
            "courses"
        );


    if (error) {

        container.textContent =
            error.message;

        return;

    }


    if (!data.length) {

        container.innerHTML = `

            <p style="
                color:var(--muted);
            ">

                No courses created yet.

            </p>

        `;

        return;

    }


    container.innerHTML =

        data.map(
            course => `

            <article
            class="course">

                <div>

                    <h3>

                        ${escapeHTML(
                            course.title
                        )}

                    </h3>

                    <p>

                        ${escapeHTML(
                            course.level
                        )}

                        ·

                        ${escapeHTML(
                            course.slug
                        )}

                    </p>

                </div>

                <span
                class="badge">

                    ${
                        course.published
                        ? "Published"
                        : "Draft"
                    }

                </span>

            </article>

            `
        ).join("");

}


/*
================================
CREATE COURSE
================================
*/

async function createCourse(
    event
) {


    event.preventDefault();


    const title =
        document.getElementById(
            "courseTitle"
        ).value.trim();


    const slug =
        document.getElementById(
            "courseSlug"
        ).value.trim()
        .toLowerCase();


    const description =
        document.getElementById(
            "courseDescription"
        ).value.trim();


    const level =
        document.getElementById(
            "courseLevel"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    const {
        error
    } =
    await supabaseClient

        .from("courses")

        .insert({

            title,

            slug,

            description,

            level,

            published:true

        });


    if (error) {

        message.className =
            "message error";

        message.textContent =
            error.message;

        return;

    }


    message.className =
        "message success";


    message.textContent =
        "✓ Course created successfully.";


    event.target.reset();


    await loadStats();

    await loadCourses();

}


/*
================================
LOGOUT
================================
*/

async function logout() {

    await supabaseClient.auth
        .signOut();

    location.href =
        "login.html";

}


/*
================================
ESCAPE
================================
*/

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


init();

</script>
