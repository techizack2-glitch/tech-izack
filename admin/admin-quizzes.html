<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";

const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let courseId = null;

let selectedQuizId = null;

let editingQuizId = null;

let editingQuestionId = null;


/*
================================
INIT
================================
*/

async function init() {

    const {
        data
    } =
    await supabaseClient.auth
        .getUser();


    if (!data.user) {

        location.href =
            "login.html";

        return;

    }


    const {
        data: profile
    } =
    await supabaseClient

        .from("profiles")

        .select("role")

        .eq(
            "id",
            data.user.id
        )

        .single();


    if (
        !profile ||
        profile.role !== "admin"
    ) {

        location.href =
            "student-dashboard.html";

        return;

    }


    courseId =
        new URLSearchParams(
            location.search
        ).get("course_id");


    if (!courseId) {

        alert(
            "Course ID missing."
        );

        location.href =
            "admin.html";

        return;

    }


    await loadCourse();

    await loadQuizzes();

}


/*
================================
COURSE
================================
*/

async function loadCourse() {

    const {
        data,
        error
    } =
    await supabaseClient

        .from("courses")

        .select("title")

        .eq(
            "id",
            courseId
        )

        .single();


    if (
        error ||
        !data
    ) {

        alert(
            "Course not found."
        );

        return;

    }


    document.getElementById(
        "courseTitle"
    ).textContent =
        data.title;

}


/*
================================
QUIZZES
================================
*/

async function loadQuizzes() {

    const {
        data,
        error
    } =
    await supabaseClient

        .from("quizzes")

        .select("*")

        .eq(
            "course_id",
            courseId
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    const container =
        document.getElementById(
            "quizList"
        );


    if (error) {

        container.textContent =
            error.message;

        return;

    }


    if (!data.length) {

        container.innerHTML = `
            <p style="color:var(--muted)">
                No quizzes yet.
            </p>
        `;

        return;

    }


    container.innerHTML =
        data.map(
            quiz => `

            <div class="quiz-item">

                <div class="quiz-title">

                    ${escapeHTML(
                        quiz.title
                    )}

                </div>


                <p style="color:var(--muted)">

                    ${escapeHTML(
                        quiz.description || ""
                    )}

                </p>


                <span class="meta">

                    Pass:
                    ${quiz.pass_percentage}%

                </span>


                <span class="meta">

                    ${
                        quiz.published
                        ? "Published"
                        : "Draft"
                    }

                </span>


                <div class="actions">

                    <button
                    class="btn btn-primary"
                    onclick="manageQuestions(
                        ${quiz.id},
                        '${escapeJS(
                            quiz.title
                        )}'
                    )">

                        Questions

                    </button>


                    <button
                    class="btn btn-outline"
                    onclick='editQuiz(
                        ${JSON.stringify(quiz)}
                    )'>

                        Edit

                    </button>


                    <button
                    class="btn btn-outline"
                    onclick="toggleQuiz(
                        ${quiz.id},
                        ${quiz.published}
                    )">

                        ${
                            quiz.published
                            ? "Unpublish"
                            : "Publish"
                        }

                    </button>


                    <button
                    class="btn btn-danger"
                    onclick="deleteQuiz(
                        ${quiz.id}
                    )">

                        Delete

                    </button>

                </div>

            </div>

            `
        ).join("");

}


/*
================================
QUIZ FORM
================================
*/

function showQuizForm() {

    editingQuizId = null;

    document.getElementById(
        "quizForm"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "quizFormTitle"
    ).textContent =
        "Create Quiz";


    document.getElementById(
        "quizTitleInput"
    ).value = "";


    document.getElementById(
        "quizDescription"
    ).value = "";


    document.getElementById(
        "passPercentage"
    ).value = 70;


    document.getElementById(
        "quizPublished"
    ).checked = false;

}


function hideQuizForm() {

    document.getElementById(
        "quizForm"
    ).classList.add(
        "hidden"
    );

}


/*
================================
SAVE QUIZ
================================
*/

async function saveQuiz(
    event
) {

    event.preventDefault();


    const quiz = {

        course_id:
            Number(courseId),

        title:
            document.getElementById(
                "quizTitleInput"
            ).value.trim(),

        description:
            document.getElementById(
                "quizDescription"
            ).value.trim(),

        pass_percentage:
            Number(
                document.getElementById(
                    "passPercentage"
                ).value
            ),

        published:
            document.getElementById(
                "quizPublished"
            ).checked

    };


    let response;


    if (editingQuizId) {

        response =
            await supabaseClient

                .from("quizzes")

                .update(quiz)

                .eq(
                    "id",
                    editingQuizId
                );

    } else {

        response =
            await supabaseClient

                .from("quizzes")

                .insert(quiz);

    }


    if (response.error) {

        const message =
            document.getElementById(
                "quizMessage"
            );

        message.className =
            "message error";

        message.textContent =
            response.error.message;

        return;

    }


    hideQuizForm();

    await loadQuizzes();

}


/*
================================
EDIT QUIZ
================================
*/

function editQuiz(
    quiz
) {

    editingQuizId =
        quiz.id;


    document.getElementById(
        "quizForm"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "quizFormTitle"
    ).textContent =
        "Edit Quiz";


    document.getElementById(
        "quizTitleInput"
    ).value =
        quiz.title;


    document.getElementById(
        "quizDescription"
    ).value =
        quiz.description || "";


    document.getElementById(
        "passPercentage"
    ).value =
        quiz.pass_percentage;


    document.getElementById(
        "quizPublished"
    ).checked =
        quiz.published;

}


/*
================================
PUBLISH
================================
*/

async function toggleQuiz(
    id,
    currentStatus
) {

    const {
        error
    } =
    await supabaseClient

        .from("quizzes")

        .update({

            published:
                !currentStatus

        })

        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadQuizzes();

}


/*
================================
DELETE QUIZ
================================
*/

async function deleteQuiz(
    id
) {

    if (
        !confirm(
            "Delete this quiz and all its questions?"
        )
    ) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from("quizzes")

        .delete()

        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadQuizzes();

}


/*
================================
QUESTIONS
================================
*/

async function manageQuestions(
    quizId,
    title
) {

    selectedQuizId =
        quizId;


    document.getElementById(
        "questionsPanel"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "selectedQuizTitle"
    ).textContent =
        title;


    await loadQuestions();


    document.getElementById(
        "questionsPanel"
    ).scrollIntoView({
        behavior:"smooth"
    });

}


async function loadQuestions() {

    const {
        data,
        error
    } =
    await supabaseClient

        .from("quiz_questions")

        .select("*")

        .eq(
            "quiz_id",
            selectedQuizId
        )

        .order(
            "question_order",
            {
                ascending:true
            }
        );


    const container =
        document.getElementById(
            "questionsList"
        );


    if (error) {

        container.textContent =
            error.message;

        return;

    }


    if (!data.length) {

        container.innerHTML = `
            <p style="color:var(--muted)">
                No questions yet.
            </p>
        `;

        return;

    }


    container.innerHTML =
        data.map(
            (q, index) => `

            <div class="question-card">

                <div class="question-text">

                    ${index + 1}.
                    ${escapeHTML(
                        q.question
                    )}

                </div>


                <div class="options">

                    ${renderOption(
                        "A",
                        q.option_a,
                        q.correct_option
                    )}

                    ${renderOption(
                        "B",
                        q.option_b,
                        q.correct_option
                    )}

                    ${renderOption(
                        "C",
                        q.option_c,
                        q.correct_option
                    )}

                    ${renderOption(
                        "D",
                        q.option_d,
                        q.correct_option
                    )}

                </div>


                <div class="actions">

                    <button
                    class="btn btn-outline"
                    onclick='editQuestion(
                        ${JSON.stringify(q)}
                    )'>

                        Edit

                    </button>


                    <button
                    class="btn btn-danger"
                    onclick="deleteQuestion(
                        ${q.id}
                    )">

                        Delete

                    </button>

                </div>

            </div>

            `
        ).join("");

}


function renderOption(
    letter,
    text,
    correct
) {

    return `

        <div
        class="option ${
            letter === correct
            ? "correct"
            : ""
        }">

            <strong>
                ${letter}.
            </strong>

            ${escapeHTML(text)}

            ${
                letter === correct
                ? " ✓"
                : ""
            }

        </div>

    `;

}


/*
================================
QUESTION FORM
================================
*/

function showQuestionForm() {

    editingQuestionId = null;


    document.getElementById(
        "questionForm"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "questionId"
    ).value = "";


    document.getElementById(
        "questionText"
    ).value = "";


    document.getElementById(
        "optionA"
    ).value = "";


    document.getElementById(
        "optionB"
    ).value = "";


    document.getElementById(
        "optionC"
    ).value = "";


    document.getElementById(
        "optionD"
    ).value = "";


    document.getElementById(
        "correctOption"
    ).value = "A";


    document.getElementById(
        "questionOrder"
    ).value =
        document.querySelectorAll(
            ".question-card"
        ).length + 1;

}


function hideQuestionForm() {

    document.getElementById(
        "questionForm"
    ).classList.add(
        "hidden"
    );

}


/*
================================
SAVE QUESTION
================================
*/

async function saveQuestion(
    event
) {

    event.preventDefault();


    if (!selectedQuizId) {

        alert(
            "Select a quiz first."
        );

        return;

    }


    const question = {

        quiz_id:
            selectedQuizId,

        question:
            document.getElementById(
                "questionText"
            ).value.trim(),

        option_a:
            document.getElementById(
                "optionA"
            ).value.trim(),

        option_b:
            document.getElementById(
                "optionB"
            ).value.trim(),

        option_c:
            document.getElementById(
                "optionC"
            ).value.trim(),

        option_d:
            document.getElementById(
                "optionD"
            ).value.trim(),

        correct_option:
            document.getElementById(
                "correctOption"
            ).value,

        question_order:
            Number(
                document.getElementById(
                    "questionOrder"
                ).value
            )

    };


    let response;


    if (editingQuestionId) {

        response =
            await supabaseClient

                .from("quiz_questions")

                .update(question)

                .eq(
                    "id",
                    editingQuestionId
                );

    } else {

        response =
            await supabaseClient

                .from("quiz_questions")

                .insert(question);

    }


    if (response.error) {

        alert(
            response.error.message
        );

        return;

    }


    hideQuestionForm();

    await loadQuestions();

}


/*
================================
EDIT QUESTION
================================
*/

function editQuestion(
    q
) {

    editingQuestionId =
        q.id;


    document.getElementById(
        "questionForm"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "questionId"
    ).value =
        q.id;


    document.getElementById(
        "questionText"
    ).value =
        q.question;


    document.getElementById(
        "optionA"
    ).value =
        q.option_a;


    document.getElementById(
        "optionB"
    ).value =
        q.option_b;


    document.getElementById(
        "optionC"
    ).value =
        q.option_c;


    document.getElementById(
        "optionD"
    ).value =
        q.option_d;


    document.getElementById(
        "correctOption"
    ).value =
        q.correct_option;


    document.getElementById(
        "questionOrder"
    ).value =
        q.question_order;

}


/*
================================
DELETE QUESTION
================================
*/

async function deleteQuestion(
    id
) {

    if (
        !confirm(
            "Delete this question?"
        )
    ) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from("quiz_questions")

        .delete()

        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadQuestions();

}


/*
================================
ESCAPE
================================
*/

function escapeHTML(
    text
) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeJS(
    text
) {

    return String(text)

        .replaceAll(
            "\\",
            "\\\\"
        )

        .replaceAll(
            "'",
            "\\'"
        );

}


init();

</script>

</body>

</html>
```
