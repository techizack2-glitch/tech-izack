<script>


const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


let tools = [];


/*
=================================
CHECK ADMIN
=================================
*/

async function checkAdmin() {

    const {
        data: {
            user
        }
    } =
    await supabaseClient.auth
        .getUser();


    if (!user) {

        location.href =
            "login.html";

        return;

    }


    /*
      IMPORTANT:

      Do not trust frontend alone
      for admin authorization.

      Your database RLS policies
      must also enforce admin access.
    */


    loadDashboard();

}


/*
=================================
LOAD DASHBOARD
=================================
*/

async function loadDashboard() {

    await Promise.all([

        loadStats(),

        loadTools()

    ]);

}


/*
=================================
STATS
=================================
*/

async function loadStats() {


    const tables = [

        ["kali_tools","toolCount"],

        ["courses","courseCount"],

        ["lessons","lessonCount"],

        ["labs","labCount"]

    ];


    for (
        const [
            table,
            element
        ]
        of tables
    ) {


        const {
            count
        } =
        await supabaseClient

            .from(table)

            .select(
                "*",
                {
                    count:"exact",
                    head:true
                }
            );


        document.getElementById(
            element
        ).textContent =

            count || 0;

    }

}


/*
=================================
LOAD TOOLS
=================================
*/

async function loadTools() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("kali_tools")

        .select("*")

        .order(
            "id",
            {
                ascending:false
            }
        );


    if (error) {

        showMessage(
            error.message,
            "error"
        );

        return;

    }


    tools =
        data || [];


    renderTools();

}


/*
=================================
RENDER
=================================
*/

function renderTools() {


    const search =
        document
        .getElementById(
            "toolSearch"
        )
        .value
        .toLowerCase();


    const filtered =
        tools.filter(
            tool =>

            tool.name
            .toLowerCase()
            .includes(search)

            ||

            tool.category
            .toLowerCase()
            .includes(search)
        );


    document
    .getElementById(
        "toolsTable"
    )
    .innerHTML =

    filtered.map(
        tool => `

        <tr>

            <td>
                ${escapeHTML(
                    tool.name
                )}
            </td>

            <td>
                ${escapeHTML(
                    tool.category
                )}
            </td>

            <td>
                ${escapeHTML(
                    tool.level
                )}
            </td>

            <td>

                ${
                    tool.published
                    ? "✓"
                    : "No"
                }

            </td>

            <td>

                <button
                class="action-btn danger"
                onclick="
                deleteTool(${tool.id})
                ">

                    Delete

                </button>

            </td>

        </tr>

        `
    ).join("");

}


/*
=================================
ADD TOOL
=================================
*/

document
.getElementById(
    "toolForm"
)
.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const tool = {

            name:
                value("name"),

            category:
                value("category"),

            level:
                value("level"),

            description:
                value("description"),

            purpose:
                value("purpose"),

            lab_instructions:
                value("instructions"),

            safe_command:
                value("command"),

            published:
                document
                .getElementById(
                    "published"
                )
                .value === "true"

        };


        const {
            error
        } =
        await supabaseClient

            .from("kali_tools")

            .insert(tool);


        if (error) {

            showMessage(
                error.message,
                "error"
            );

            return;

        }


        showMessage(
            "Tool added successfully.",
            "success"
        );


        event.target.reset();


        await loadTools();

        await loadStats();

    }
);


/*
=================================
DELETE TOOL
=================================
*/

async function deleteTool(id) {


    const confirmed =
        confirm(
            "Delete this tool?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from("kali_tools")

        .delete()

        .eq(
            "id",
            id
        );


    if (error) {

        showMessage(
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        "Tool deleted.",
        "success"
    );


    await loadTools();

    await loadStats();

}


/*
=================================
SEARCH
=================================
*/

document
.getElementById(
    "toolSearch"
)
.addEventListener(
    "input",
    renderTools
);


/*
=================================
HELPERS
=================================
*/

function value(id) {

    return document
        .getElementById(id)
        .value
        .trim();

}


function showMessage(
    text,
    type
) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;


    element.className =
        `message ${type}`;

}


function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


async function logout() {

    await supabaseClient.auth.signOut();

    location.href =
        "login.html";

}


checkAdmin();

</script>
