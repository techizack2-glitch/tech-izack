<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";

const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let user = null;
let courseId = null;


/*
==============================
INITIALIZE
==============================
*/

async function init() {

    const {
        data
    } =
    await supabaseClient.auth
        .getUser();

    user = data.user;

    if (!user) {

        location.href =
            "login.html";

        return;

    }


    const {
        data: profile
    } =
    await supabaseClient

        .from("profiles")

        .select("role")

        .eq(
            "id",
            user.id
        )

        .single();


    if (
        !profile ||
        profile.role !== "admin"
    ) {

        location.href =
            "student-dashboard.html";

        return;

    }


    courseId =
        new URLSearchParams(
            location.search
        ).get("course_id");


    if (!courseId) {

        alert(
            "Course ID missing."
        );

        location.href =
            "admin.html";

        return;

    }


    await loadCourse();

    await loadLabs();

}


/*
==============================
LOAD COURSE
==============================
*/

async function loadCourse() {

    const {
        data,
        error
    } =
    await supabaseClient

        .from("courses")

        .select("title")

        .eq(
            "id",
            courseId
        )

        .single();


    if (error || !data) {

        alert(
            "Course not found."
        );

        location.href =
            "admin.html";

        return;

    }


    document.getElementById(
        "courseTitle"
    ).textContent =
        data.title;

}


/*
==============================
LOAD LABS
==============================
*/

async function loadLabs() {

    const {
        data,
        error
    } =
    await supabaseClient

        .from("labs")

        .select(
            "id,title,description,difficulty,lab_order,published"
        )

        .eq(
            "course_id",
            courseId
        )

        .order(
            "lab_order",
            {
                ascending:true
            }
        );


    const container =
        document.getElementById(
            "labs"
        );


    if (error) {

        container.textContent =
            error.message;

        return;

    }


    if (!data || !data.length) {

        container.innerHTML = `

            <p style="color:var(--muted)">

                No labs yet.
                Click "Add Lab" to create one.

            </p>

        `;

        return;

    }


    container.innerHTML = data.map(
        lab => `

        <article class="lab">

            <div class="lab-top">

                <div>

                    <div class="lab-title">

                        ${lab.lab_order}.
                        ${escapeHTML(
                            lab.title
                        )}

                    </div>


                    <div class="lab-description">

                        ${escapeHTML(
                            lab.description || ""
                        )}

                    </div>


                    <div class="lab-meta">

                        <span class="meta">

                            ${escapeHTML(
                                lab.difficulty
                            )}

                        </span>


                        <span class="meta">

                            ${
                                lab.published
                                ? "Published"
                                : "Draft"
                            }

                        </span>

                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                class="btn btn-outline"
                onclick='editLab(
                    ${JSON.stringify(lab)}
                )'>

                    Edit

                </button>


                <button
                class="btn btn-outline"
                onclick="toggleLab(
                    ${lab.id},
                    ${lab.published}
                )">

                    ${
                        lab.published
                        ? "Unpublish"
                        : "Publish"
                    }

                </button>


                <button
                class="btn btn-danger"
                onclick="deleteLab(
                    ${lab.id}
                )">

                    Delete

                </button>

            </div>

        </article>

        `
    ).join("");

}


/*
==============================
SHOW FORM
==============================
*/

function showForm() {

    document.getElementById(
        "labForm"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "formTitle"
    ).textContent =
        "New Practical Lab";


    document.getElementById(
        "labId"
    ).value = "";


    document.getElementById(
        "title"
    ).value = "";


    document.getElementById(
        "description"
    ).value = "";


    document.getElementById(
        "objective"
    ).value = "";


    document.getElementById(
        "instructions"
    ).value = "";


    document.getElementById(
        "hint"
    ).value = "";


    document.getElementById(
        "flag"
    ).value = "";


    document.getElementById(
        "difficulty"
    ).value =
        "Beginner";


    document.getElementById(
        "labOrder"
    ).value =
        "1";


    document.getElementById(
        "published"
    ).checked =
        true;

}


/*
==============================
HIDE FORM
==============================
*/

function hideForm() {

    document.getElementById(
        "labForm"
    ).classList.add(
        "hidden"
    );

}


/*
==============================
EDIT LAB
==============================
*/

async function editLab(
    lab
) {

    /*
    Fetch the flag only when
    editing from the admin page.
    */

    const {
        data,
        error
    } =
    await supabaseClient

        .from("labs")

        .select("*")

        .eq(
            "id",
            lab.id
        )

        .single();


    if (error || !data) {

        alert(
            "Could not load lab."
        );

        return;

    }


    showForm();


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Practical Lab";


    document.getElementById(
        "labId"
    ).value =
        data.id;


    document.getElementById(
        "title"
    ).value =
        data.title || "";


    document.getElementById(
        "description"
    ).value =
        data.description || "";


    document.getElementById(
        "objective"
    ).value =
        data.objective || "";


    document.getElementById(
        "instructions"
    ).value =
        data.instructions || "";


    document.getElementById(
        "hint"
    ).value =
        data.hint || "";


    document.getElementById(
        "flag"
    ).value =
        data.flag || "";


    document.getElementById(
        "difficulty"
    ).value =
        data.difficulty || "Beginner";


    document.getElementById(
        "labOrder"
    ).value =
        data.lab_order || 1;


    document.getElementById(
        "published"
    ).checked =
        data.published;

}


/*
==============================
SAVE LAB
==============================
*/

async function saveLab(
    event
) {

    event.preventDefault();


    const id =
        document.getElementById(
            "labId"
        ).value;


    const lab = {

        course_id:
            Number(courseId),

        title:
            document.getElementById(
                "title"
            ).value.trim(),

        description:
            document.getElementById(
                "description"
            ).value.trim(),

        objective:
            document.getElementById(
                "objective"
            ).value.trim(),

        instructions:
            document.getElementById(
                "instructions"
            ).value.trim(),

        hint:
            document.getElementById(
                "hint"
            ).value.trim(),

        flag:
            document.getElementById(
                "flag"
            ).value.trim(),

        difficulty:
            document.getElementById(
                "difficulty"
            ).value,

        lab_order:
            Number(
                document.getElementById(
                    "labOrder"
                ).value
            ),

        published:
            document.getElementById(
                "published"
            ).checked

    };


    let response;


    if (id) {

        response =
            await supabaseClient

                .from("labs")

                .update(lab)

                .eq(
                    "id",
                    id
                );

    } else {

        response =
            await supabaseClient

                .from("labs")

                .insert(lab);

    }


    const message =
        document.getElementById(
            "message"
        );


    if (response.error) {

        message.className =
            "message error";

        message.textContent =
            response.error.message;

        return;

    }


    message.className =
        "message success";

    message.textContent =
        "✓ Lab saved successfully.";


    await loadLabs();


    setTimeout(
        hideForm,
        700
    );

}


/*
==============================
PUBLISH / UNPUBLISH
==============================
*/

async function toggleLab(
    id,
    currentStatus
) {

    const {
        error
    } =
    await supabaseClient

        .from("labs")

        .update({

            published:
                !currentStatus

        })

        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadLabs();

}


/*
==============================
DELETE
==============================
*/

async function deleteLab(
    id
) {

    if (
        !confirm(
            "Delete this lab?"
        )
    ) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from("labs")

        .delete()

        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadLabs();

}


/*
==============================
ESCAPE HTML
==============================
*/

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


init();

</script>

</body>

</html>
