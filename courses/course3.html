src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">

<script>


/* =========================
   SUPABASE
========================= */


const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);



/* =========================
   VARIABLES
========================= */


const courseId =
new URLSearchParams(
    location.search
).get("id");


let user = null;

let course = null;

let lessons = [];

let progress = [];

let currentLesson = null;



/* =========================
   INIT
========================= */


async function init() {


    const {
        data
    } =
    await supabaseClient.auth
        .getUser();


    user =
        data.user;


    if (!user) {

        location.href =
            "login.html";

        return;

    }


    if (!courseId) {

        document.getElementById(
            "lessonContent"
        ).innerHTML =

            "<p>Course ID missing.</p>";

        return;

    }


    /*
    SECURITY:
    Check course access first.
    */


    const {
        data: access,
        error: accessError
    } =
    await supabaseClient

        .from("course_access")

        .select("id")

        .eq(
            "user_id",
            user.id
        )

        .eq(
            "course_id",
            courseId
        )

        .eq(
            "active",
            true
        )

        .maybeSingle();


    if (
        accessError ||
        !access
    ) {

        location.href =
            `payment.html?course=${courseId}`;

        return;

    }


    await loadCourse();

    await loadLessons();

    await loadProgress();


    if (lessons.length) {

        showLesson(
            lessons[0].id
        );

    }

}



/* =========================
   COURSE
========================= */


async function loadCourse() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("courses")

        .select(`
            id,
            title,
            description,
            price,
            currency
        `)

        .eq(
            "id",
            courseId
        )

        .single();


    if (
        error ||
        !data
    ) {

        document.getElementById(
            "courseTitle"
        ).textContent =
            "Course not found.";

        return;

    }


    course =
    data;


    document.getElementById(
        "courseTitle"
    ).textContent =
        course.title;


    document.getElementById(
        "courseDescription"
    ).textContent =
        course.description || "";


    document.getElementById(
        "courseMeta"
    ).innerHTML = `

        <span>
            📚 Academy Course
        </span>

        <span>
            🔐 Authorized Lab
        </span>

    `;

}



/* =========================
   LESSONS
========================= */


async function loadLessons() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("lessons")

        .select(`
            id,
            title,
            content,
            video_url,
            position,
            published
        `)

        .eq(
            "course_id",
            courseId
        )

        .eq(
            "published",
            true
        )

        .order(
            "position",
            {
                ascending:true
            }
        );


    if (error) {

        console.error(error);

        return;

    }


    lessons =
    data || [];


    renderLessonList();

}



/* =========================
   PROGRESS
========================= */


async function loadProgress() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("lesson_progress")

        .select(`
            lesson_id,
            completed,
            completed_at
        `)

        .eq(
            "user_id",
            user.id
        );


    if (error) {

        console.error(error);

        return;

    }


    progress =
    data || [];


    updateProgress();

    renderLessonList();

}



/* =========================
   LESSON LIST
========================= */


function renderLessonList() {


    const container =
        document.getElementById(
            "lessonList"
        );


    if (!lessons.length) {

        container.innerHTML =

            `<div class="empty">
                No lessons available.
            </div>`;

        return;

    }


    container.innerHTML =
        lessons.map(
            (
                lesson,
                index
            ) => {


                const completed =
                    isCompleted(
                        lesson.id
                    );


                const active =
                    currentLesson &&
                    currentLesson.id ===
                    lesson.id;


                return `

                    <div
                    class="lesson-item
                    ${active ? "active" : ""}
                    ${completed ? "completed" : ""}"
                    onclick="showLesson(
                        ${lesson.id}
                    )">


                        <div
                        class="lesson-number">

                            LESSON
                            ${index + 1}

                            ${
                                completed
                                ? " ✓"
                                : ""
                            }

                        </div>


                        <div
                        class="lesson-title">

                            ${escapeHTML(
                                lesson.title
                            )}

                        </div>

                    </div>

                `;

            }
        ).join("");

}



/* =========================
   SHOW LESSON
========================= */


function showLesson(
    lessonId
) {


    const lesson =
        lessons.find(
            item =>
                item.id ===
                lessonId
        );


    if (!lesson) {

        return;

    }


    currentLesson =
    lesson;


    renderLessonList();


    const completed =
        isCompleted(
            lesson.id
        );


    const index =
        lessons.findIndex(
            item =>
                item.id ===
                lesson.id
        );


    let video = "";


    if (lesson.video_url) {

        video = `

            <div class="video-box">

                <a
                href="${escapeHTML(
                    lesson.video_url
                )}"
                target="_blank"
                rel="noopener">

                    ▶ Watch Lesson Video

                </a>

            </div>

        `;

    }


    document.getElementById(
        "lessonContent"
    ).innerHTML = `


        <span class="section-tag">

            LESSON ${index + 1}

        </span>


        <h2>

            ${escapeHTML(
                lesson.title
            )}

        </h2>


        ${video}


        <div class="lesson-body">

            ${sanitizeLessonHTML(
                lesson.content ||
                "<p>No lesson content yet.</p>"
            )}

        </div>


        <div class="lesson-actions">


            <button
            class="btn btn-outline
            ${index === 0
                ? "btn-disabled"
                : ""}"
            onclick="previousLesson()">

                ← Previous

            </button>


            <button
            id="completeButton"
            class="btn btn-primary"
            onclick="completeLesson()">

                ${
                    completed
                    ? "✓ Completed"
                    : "✓ Mark Complete"
                }

            </button>


            <button
            class="btn btn-outline
            ${index === lessons.length - 1
                ? "btn-disabled"
                : ""}"
            onclick="nextLesson()">

                Next →

            </button>


        </div>


        ${labPlaceholder()}

    `;

}



/*
Simple placeholder for the
practical lab section.

Actual labs will be connected
to the labs table in the next
step.
*/


function labPlaceholder() {

    return `

        <div class="lab-box">

            <h3>
                🧪 Practical Lab
            </h3>


            <p class="lab-warning">

                Practice only inside
                authorized labs,
                CTFs or systems you
                own/have permission
                to test.

            </p>


            <a
            href="labs.html?course=${encodeURIComponent(
                courseId
            )}&lesson=${encodeURIComponent(
                currentLesson?.id || ""
            )}"
            class="btn btn-outline">

                Open Practical Lab →

            </a>

        </div>

    `;

}



/* =========================
   COMPLETE LESSON
========================= */


async function completeLesson() {


    if (!currentLesson) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from("lesson_progress")

        .upsert({

            user_id:
                user.id,

            lesson_id:
                currentLesson.id,

            completed:
                true,

            completed_at:
                new Date().toISOString()

        }, {

            onConflict:
                "user_id,lesson_id"

        });


    if (error) {

        console.error(error);

        alert(
            "Unable to save progress."
        );

        return;

    }


    /*
    Update local state
    */

    const existing =
        progress.find(
            item =>
                item.lesson_id ===
                currentLesson.id
        );


    if (existing) {

        existing.completed =
            true;

    } else {

        progress.push({

            lesson_id:
                currentLesson.id,

            completed:
                true

        });

    }


    updateProgress();

    renderLessonList();

    showLesson(
        currentLesson.id
    );

}



/* =========================
   PROGRESS BAR
========================= */


function updateProgress() {


    if (!lessons.length) {

        return;

    }


    const completed =
        lessons.filter(
            lesson =>
                isCompleted(
                    lesson.id
                )
        ).length;


    const percentage =
        Math.round(
            (
                completed /
                lessons.length
            ) * 100
        );


    document.getElementById(
        "progressFill"
    ).style.width =
        `${percentage}%`;


    document.getElementById(
        "progressText"
    ).textContent =
        `${percentage}%`;

}



/* =========================
   COMPLETED?
========================= */


function isCompleted(
    lessonId
) {


    return progress.some(
        item =>

            item.lesson_id ===
            lessonId &&

            item.completed ===
            true
    );

}



/* =========================
   NEXT
========================= */


function nextLesson() {


    if (!currentLesson) {

        return;

    }


    const index =
        lessons.findIndex(
            item =>
                item.id ===
                currentLesson.id
        );


    if (
        index <
        lessons.length - 1
    ) {

        showLesson(
            lessons[index + 1].id
        );

    }

}



/* =========================
   PREVIOUS
========================= */


function previousLesson() {


    if (!currentLesson) {

        return;

    }


    const index =
        lessons.findIndex(
            item =>
                item.id ===
                currentLesson.id
        );


    if (index > 0) {

        showLesson(
            lessons[index - 1].id
        );

    }

}



/* =========================
   LOGOUT
========================= */


async function logout() {

    await supabaseClient.auth
        .signOut();

    location.href =
        "login.html";

}



/* =========================
   HTML SAFETY
========================= */


/*
For lesson content stored in
your own database, you can use
a sanitizer on the backend.

This simple version allows only
a controlled set of tags.
*/


function sanitizeLessonHTML(
    html
) {

    const template =
        document.createElement(
            "template"
        );

    template.innerHTML =
        html;


    const allowed = [
        "P",
        "H3",
        "H4",
        "STRONG",
        "EM",
        "UL",
        "OL",
        "LI",
        "CODE",
        "PRE",
        "BR"
    ];


    template.content
        .querySelectorAll("*")
        .forEach(
            element => {

                if (
                    !allowed.includes(
                        element.tagName
                    )
                ) {

                    element.replaceWith(
                        ...element.childNodes
                    );

                }

            }
        );


    return template.innerHTML;

}



/* =========================
   ESCAPE
========================= */


function escapeHTML(
    text
) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



init();

</script>

</body>
