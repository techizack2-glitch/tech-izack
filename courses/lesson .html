<script>


const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


let user = null;

let lesson = null;

let courseLessons = [];

let currentIndex = 0;


/*
================================
INITIALIZE
================================
*/

async function init() {


    const {
        data
    } =
    await supabaseClient.auth
        .getUser();


    user =
        data.user;


    if (!user) {

        location.href =
            "login.html";

        return;

    }


    const lessonId =
        new URLSearchParams(
            location.search
        ).get("id");


    if (!lessonId) {

        showError(
            "Lesson ID missing."
        );

        return;

    }


    await loadLesson(
        lessonId
    );

}


/*
================================
LOAD LESSON
================================
*/

async function loadLesson(
    lessonId
) {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("lessons")

        .select("*")

        .eq(
            "id",
            lessonId
        )

        .eq(
            "published",
            true
        )

        .single();


    if (error || !data) {

        showError(
            "Lesson not found."
        );

        return;

    }


    lesson =
        data;


    await loadCourseLessons();

    renderLesson();

    await loadCompletion();

}


/*
================================
LOAD COURSE LESSONS
================================
*/

async function loadCourseLessons() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("lessons")

        .select(
            "id,title,lesson_order"
        )

        .eq(
            "course_id",
            lesson.course_id
        )

        .eq(
            "published",
            true
        )

        .order(
            "lesson_order",
            {
                ascending:true
            }
        );


    if (error) {

        console.error(error);

        return;

    }


    courseLessons =
        data || [];


    currentIndex =
        courseLessons.findIndex(
            item =>
                item.id === lesson.id
        );


    updateNavigation();


    await updateCourseProgress();

}


/*
================================
RENDER
================================
*/

function renderLesson() {


    const total =
        courseLessons.length;


    document.getElementById(
        "lessonNumber"
    ).textContent =

        `LESSON ${
            currentIndex + 1
        } / ${total}`;


    document.getElementById(
        "lessonTitle"
    ).textContent =
        lesson.title;


    document.getElementById(
        "lessonDescription"
    ).textContent =
        lesson.description || "";


    document.getElementById(
        "lessonContent"
    ).textContent =
        lesson.content || "";


    if (lesson.video_url) {

        const video =
            convertVideoUrl(
                lesson.video_url
            );


        if (video) {

            document.getElementById(
                "lessonVideo"
            ).src =
                video;


            document.getElementById(
                "videoContainer"
            ).style.display =
                "block";

        }

    }


    updateNavigation();

}


/*
================================
VIDEO URL
================================
*/

function convertVideoUrl(
    url
) {


    try {

        const parsed =
            new URL(url);


        /*
        YouTube
        */

        if (
            parsed.hostname
                .includes("youtube.com")
        ) {

            const videoId =
                parsed.searchParams
                .get("v");


            if (videoId) {

                return
                    `https://www.youtube.com/embed/${videoId}`;

            }

        }


        if (
            parsed.hostname
                .includes("youtu.be")
        ) {

            const videoId =
                parsed.pathname
                .substring(1);


            return
                `https://www.youtube.com/embed/${videoId}`;

        }


        /*
        Vimeo
        */

        if (
            parsed.hostname
                .includes("vimeo.com")
        ) {

            const videoId =
                parsed.pathname
                .split("/")
                .filter(Boolean)
                .pop();


            return
                `https://player.vimeo.com/video/${videoId}`;

        }


        return url;

    } catch {

        return null;

    }

}


/*
================================
LOAD COMPLETION
================================
*/

async function loadCompletion() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("lesson_progress")

        .select("*")

        .eq(
            "user_id",
            user.id
        )

        .eq(
            "lesson_id",
            lesson.id
        )

        .maybeSingle();


    if (error) {

        console.error(error);

        return;

    }


    if (
        data &&
        data.completed
    ) {

        showCompleted();

    }

}


/*
================================
MARK COMPLETE
================================
*/

async function markComplete() {


    const {
        error
    } =
    await supabaseClient

        .from("lesson_progress")

        .upsert(

            {

                user_id:
                    user.id,

                lesson_id:
                    lesson.id,

                completed:true,

                completed_at:
                    new Date()
                    .toISOString()

            },

            {

                onConflict:
                    "user_id,lesson_id"

            }

        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    showCompleted();


    await updateCourseProgress();

}


/*
================================
SHOW COMPLETED
================================
*/

function showCompleted() {


    document.getElementById(
        "completionStatus"
    ).innerHTML = `

        <div class="complete-status">

            ✓ Lesson completed

        </div>

    `;


    const button =
        document.getElementById(
            "completeButton"
        );


    button.textContent =
        "✓ Completed";


    button.disabled = true;

    button.style.opacity =
        ".6";

}


/*
================================
COURSE PROGRESS
================================
*/

async function updateCourseProgress() {


    if (!courseLessons.length) {

        return;

    }


    const ids =
        courseLessons.map(
            item =>
                item.id
        );


    const {
        data,
        error
    } =
    await supabaseClient

        .from("lesson_progress")

        .select("lesson_id")

        .eq(
            "user_id",
            user.id
        )

        .eq(
            "completed",
            true
        )

        .in(
            "lesson_id",
            ids
        );


    if (error) {

        console.error(error);

        return;

    }


    const completed =
        data?.length || 0;


    const total =
        courseLessons.length;


    const percentage =
        Math.round(
            completed /
            total *
            100
        );


    document.getElementById(
        "progressFill"
    ).style.width =
        `${percentage}%`;


    document.getElementById(
        "progressText"
    ).textContent =

        `${completed} of ${total} lessons completed — ${percentage}%`;

}


/*
================================
NAVIGATION
================================
*/

function updateNavigation() {


    const previous =
        document.getElementById(
            "previousButton"
        );


    const next =
        document.getElementById(
            "nextButton"
        );


    if (
        currentIndex > 0
    ) {

        previous.href =

            `lesson.html?id=${
                courseLessons[
                    currentIndex - 1
                ].id
            }`;

        previous.classList.remove(
            "disabled"
        );

    } else {

        previous.href = "#";

        previous.classList.add(
            "disabled"
        );

    }


    if (
        currentIndex <
        courseLessons.length - 1
    ) {

        next.href =

            `lesson.html?id=${
                courseLessons[
                    currentIndex + 1
                ].id
            }`;

        next.classList.remove(
            "disabled"
        );

    } else {

        next.href =
            "#";

        next.textContent =
            "Course Complete";

        next.classList.add(
            "disabled"
        );

    }

}


/*
================================
ERROR
================================
*/

function showError(
    message
) {

    document.body.innerHTML = `

        <div style="
            color:white;
            text-align:center;
            padding:120px 20px;
        ">

            <h1>
                ${escapeHTML(
                    message
                )}
            </h1>

            <a
            href="student-dashboard.html"
            class="btn btn-primary">

                Back to Dashboard

            </a>

        </div>

    `;

}


/*
================================
ESCAPE
================================
*/

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


init();

</script>

</body>

</html>
