<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const params =
new URLSearchParams(
    window.location.search
);


const lessonId =
params.get("id");


let editing = false;


// ==========================
// ADMIN
// ==========================

async function checkAdmin() {

    const {
        data:{user}
    } =
    await supabaseClient
        .auth
        .getUser();


    if (!user) {

        location.href =
        "index.html";

        return false;

    }


    const {
        data:profile
    } =
    await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id",user.id)
        .single();


    if (
        !profile ||
        profile.role !== "admin"
    ) {

        location.href =
        "dashboard.html";

        return false;

    }


    return true;

}


// ==========================
// COURSES
// ==========================

async function loadCourses() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("courses")
        .select("id,title")
        .order("title");


    if (error) {

        showMessage(
            error.message,
            true
        );

        return;

    }


    const select =
    document.getElementById(
        "courseId"
    );


    select.innerHTML = `
        <option value="">
            Select course
        </option>
    `;


    data.forEach(
        course => {

            select.innerHTML += `

            <option
            value="${course.id}">

            ${escapeHTML(
                course.title
            )}

            </option>

            `;

        }
    );

}


// ==========================
// LOAD LESSON
// ==========================

async function loadLesson() {

    if (!lessonId) return;


    editing = true;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("lessons")
        .select("*")
        .eq("id",lessonId)
        .single();


    if (error || !data) {

        showMessage(
            "Lesson not found.",
            true
        );

        return;

    }


    document.getElementById(
        "courseId"
    ).value =
    data.course_id;


    document.getElementById(
        "title"
    ).value =
    data.title || "";


    document.getElementById(
        "lessonOrder"
    ).value =
    data.lesson_order || 1;


    document.getElementById(
        "videoUrl"
    ).value =
    data.video_url || "";


    document.getElementById(
        "content"
    ).value =
    data.content || "";


    document.getElementById(
        "published"
    ).checked =
    data.published === true;


    document.querySelector(
        "h1"
    ).textContent =
    "Edit Lesson";


    document.querySelector(
        "#lessonForm button"
    ).textContent =
    "Update Lesson →";

}


// ==========================
// SAVE
// ==========================

document
.getElementById("lessonForm")
.addEventListener(
"submit",
async function(event) {

    event.preventDefault();


    const payload = {

        course_id:
        Number(
            document
            .getElementById(
                "courseId"
            )
            .value
        ),

        title:
        document
        .getElementById(
            "title"
        )
        .value
        .trim(),

        lesson_order:
        Number(
            document
            .getElementById(
                "lessonOrder"
            )
            .value
        ),

        video_url:
        document
        .getElementById(
            "videoUrl"
        )
        .value
        .trim() || null,

        content:
        document
        .getElementById(
            "content"
        )
        .value
        .trim(),

        published:
        document
        .getElementById(
            "published"
        )
        .checked

    };


    if (
        !payload.course_id ||
        !payload.title ||
        !payload.content
    ) {

        showMessage(
            "Course, title and content are required.",
            true
        );

        return;

    }


    let result;


    if (editing) {

        result =
        await supabaseClient
            .from("lessons")
            .update(payload)
            .eq(
                "id",
                lessonId
            );

    } else {

        result =
        await supabaseClient
            .from("lessons")
            .insert(payload);

    }


    if (result.error) {

        showMessage(
            result.error.message,
            true
        );

        return;

    }


    showMessage(
        editing
        ? "✓ Lesson updated successfully!"
        : "✓ Lesson created successfully!",
        false
    );


    if (!editing) {

        setTimeout(
            () => {

                location.href =
                "admin-dashboard.html";

            },
            1000
        );

    }

});


// ==========================

function showMessage(
    text,
    error
) {

    const element =
    document.getElementById(
        "message"
    );


    element.textContent =
    text;


    element.className =
    "message " +
    (
        error
        ? "error"
        : "success"
    );

}


// ==========================

function escapeHTML(text) {

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


// ==========================

(async()=>{

    const allowed =
    await checkAdmin();

    if (!allowed) return;

    await loadCourses();

    await loadLesson();

})();

</script>

</body>
</html>
