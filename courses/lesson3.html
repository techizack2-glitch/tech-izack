<body>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";

const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


let user = null;

let lesson = null;


/*
================================
INIT
================================
*/

async function init() {

    const {
        data
    } =
    await supabaseClient.auth
        .getUser();


    user =
        data.user;


    if (!user) {

        location.href =
            "login.html";

        return;

    }


    const lessonId =
        new URLSearchParams(
            location.search
        ).get("id");


    if (!lessonId) {

        showError(
            "Lesson ID missing."
        );

        return;

    }


    await loadLesson(
        lessonId
    );

}


/*
================================
LOAD LESSON
================================
*/

async function loadLesson(
    lessonId
) {

    const {
        data,
        error
    } =
    await supabaseClient

        .from("lessons")

        .select(`
            id,
            course_id,
            title,
            description,
            content,
            video_url,
            lesson_order,
            published
        `)

        .eq(
            "id",
            lessonId
        )

        .eq(
            "published",
            true
        )

        .single();


    if (
        error ||
        !data
    ) {

        showError(
            "Lesson not found."
        );

        return;

    }


    lesson =
        data;


    document.getElementById(
        "lessonTitle"
    ).textContent =
        lesson.title;


    document.getElementById(
        "lessonDescription"
    ).textContent =
        lesson.description || "";


    document.getElementById(
        "lessonBody"
    ).innerHTML =
        lesson.content || "";


    /*
    Video
    */

    if (lesson.video_url) {

        document.getElementById(
            "videoSection"
        ).classList.remove(
            "hidden"
        );


        document.getElementById(
            "lessonVideo"
        ).src =
            lesson.video_url;

    }


    await checkCompletion();

    await loadNavigation();

}


/*
================================
CHECK COMPLETION
================================
*/

async function checkCompletion() {

    const {
        data,
        error
    } =
    await supabaseClient

        .from("lesson_progress")

        .select(`
            completed,
            completed_at
        `)

        .eq(
            "user_id",
            user.id
        )

        .eq(
            "lesson_id",
            lesson.id
        )

        .maybeSingle();


    if (error) {

        console.error(error);

        return;

    }


    if (
        data &&
        data.completed
    ) {

        setCompleted();

    }

}


/*
================================
MARK COMPLETE
================================
*/

async function markComplete() {

    const button =
        document.getElementById(
            "completeButton"
        );


    button.disabled =
        true;

    button.textContent =
        "Saving...";


    const {
        error
    } =
    await supabaseClient

        .from("lesson_progress")

        .upsert(

            {

                user_id:
                    user.id,

                lesson_id:
                    lesson.id,

                completed:
                    true,

                completed_at:
                    new Date()
                        .toISOString()

            },

            {

                onConflict:
                    "user_id,lesson_id"

            }

        );


    if (error) {

        console.error(error);

        alert(
            "Could not save progress: " +
            error.message
        );

        button.disabled =
            false;

        button.textContent =
            "✓ Mark as Complete";

        return;

    }


    setCompleted();

}


/*
================================
COMPLETED STATE
================================
*/

function setCompleted() {

    const button =
        document.getElementById(
            "completeButton"
        );


    const title =
        document.getElementById(
            "completionTitle"
        );


    const text =
        document.getElementById(
            "completionText"
        );


    button.textContent =
        "✓ Completed";


    button.disabled =
        true;


    button.classList.add(
        "completed"
    );


    title.textContent =
        "Lesson Completed 🎉";


    title.classList.add(
        "completed"
    );


    text.textContent =
        "Your progress has been saved.";

}


/*
================================
NAVIGATION
================================
*/

async function loadNavigation() {

    const {
        data: lessons,
        error
    } =
    await supabaseClient

        .from("lessons")

        .select(`
            id,
            lesson_order
        `)

        .eq(
            "course_id",
            lesson.course_id
        )

        .eq(
            "published",
            true
        )

        .order(
            "lesson_order",
            {
                ascending:true
            }
        );


    if (
        error ||
        !lessons
    ) {

        return;

    }


    const currentIndex =
        lessons.findIndex(
            item =>
                item.id === lesson.id
        );


    const previous =
        lessons[
            currentIndex - 1
        ];


    const next =
        lessons[
            currentIndex + 1
        ];


    if (previous) {

        const link =
            document.getElementById(
                "previousLesson"
            );


        link.href =
            `lesson.html?id=${previous.id}`;


        link.classList.remove(
            "hidden"
        );

    }


    if (next) {

        const link =
            document.getElementById(
                "nextLesson"
            );


        link.href =
            `lesson.html?id=${next.id}`;


        link.classList.remove(
            "hidden"
        );

    }

}


/*
================================
ERROR
================================
*/

function showError(
    message
) {

    document.querySelector(
        ".lesson-container"
    ).innerHTML = `

        <section class="lesson-header">

            <h2>
                ${escapeHTML(message)}
            </h2>

            <a
            href="student-dashboard.html"
            class="btn btn-outline">

                ← Dashboard

            </a>

        </section>

    `;

}


/*
================================
ESCAPE
================================
*/

function escapeHTML(
    text
) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


init();

</script>

</body>

</html>
