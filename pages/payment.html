<script>

const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";

const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


const courseId =
new URLSearchParams(
    location.search
).get("course");


let user = null;

let selectedProvider = null;


/*
===============================
INIT
===============================
*/

async function init() {

    const {
        data
    } =
    await supabaseClient.auth
        .getUser();


    user =
        data.user;


    if (!user) {

        location.href =
            "login.html";

        return;

    }


    if (!courseId) {

        showMessage(
            "Course not specified.",
            true
        );

        return;

    }


    const {
        data: course,
        error
    } =
    await supabaseClient

        .from("courses")

        .select(`
            id,
            title,
            price,
            currency
        `)

        .eq(
            "id",
            courseId
        )

        .single();


    if (
        error ||
        !course
    ) {

        showMessage(
            "Course not found.",
            true
        );

        return;

    }


    document.getElementById(
        "courseBox"
    ).innerHTML = `

        <strong>
            ${escapeHTML(course.title)}
        </strong>

        <div class="amount">

            ${Number(
                course.price || 0
            ).toLocaleString()}

            ${escapeHTML(
                course.currency || "TZS"
            )}

        </div>

    `;

}


/*
===============================
PROVIDER
===============================
*/

function selectProvider(
    element
) {

    document
        .querySelectorAll(
            ".provider"
        )
        .forEach(
            button =>
                button.classList
                    .remove("selected")
        );


    element.classList.add(
        "selected"
    );


    selectedProvider =
        element.dataset.provider;

}


/*
===============================
PAYMENT
===============================
*/

async function startPayment() {

    if (!selectedProvider) {

        showMessage(
            "Choose a payment method.",
            true
        );

        return;

    }


    const phone =
        document
            .getElementById(
                "phone"
            )
            .value
            .trim();


    if (!/^255\d{9}$/.test(phone)) {

        showMessage(
            "Enter a valid Tanzanian number, e.g. 2557XXXXXXXX.",
            true
        );

        return;

    }


    const button =
        document.getElementById(
            "payButton"
        );


    button.disabled = true;

    button.textContent =
        "Creating payment...";


    /*
    IMPORTANT:

    The real provider API call
    will happen on the backend.

    Frontend must NEVER contain
    payment secret keys.
    */


    const {
        data,
        error
    } =
    await supabaseClient.functions
        .invoke(
            "create-payment",
            {
                body: {

                    course_id:
                        Number(courseId),

                    provider:
                        selectedProvider,

                    phone_number:
                        phone

                }
            }
        );


    if (error) {

        console.error(error);

        showMessage(
            "Unable to create payment. Please try again.",
            true
        );

        button.disabled = false;

        button.textContent =
            "Continue to Payment";

        return;

    }


    if (
        !data ||
        !data.success
    ) {

        showMessage(
            data?.error ||
            "Payment could not be started.",
            true
        );

        button.disabled = false;

        button.textContent =
            "Continue to Payment";

        return;

    }


    showMessage(
        "Payment request created. Complete the payment on your phone.",
        false
    );


    setTimeout(
        () => {

            location.href =
                `payment-status.html?id=${encodeURIComponent(
                    data.payment_id
                )}`;

        },
        1500
    );

}


/*
===============================
MESSAGE
===============================
*/

function showMessage(
    message,
    error
) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        message;


    element.className =
        error
        ? "error"
        : "success";

}


/*
===============================
ESCAPE
===============================
*/

function escapeHTML(
    text
) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


init();

</script>

</body>
