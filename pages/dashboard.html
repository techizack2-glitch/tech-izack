<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard | Tech Izack</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="../style.css">

    <style>

        .dashboard {
            padding: 130px 0 80px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .dashboard-header h1 {
            font-family: "Orbitron";
            font-size: 32px;
        }

        .dashboard-header span {
            color: var(--cyan);
        }

        .user-box {
            padding: 15px 20px;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 8px;
        }

        .user-box small {
            color: var(--muted);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 45px;
        }

        .dashboard-stat {
            padding: 25px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .dashboard-stat i {
            color: var(--cyan);
            font-size: 25px;
        }

        .dashboard-stat strong {
            display: block;
            font-size: 30px;
            margin-top: 10px;
        }

        .dashboard-stat p {
            color: var(--muted);
            font-size: 13px;
        }

        .dashboard-title {
            font-family: "Orbitron";
            margin-bottom: 20px;
        }

        .course-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .student-course {
            padding: 25px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .student-course i {
            color: var(--cyan);
            font-size: 30px;
        }

        .student-course h3 {
            margin: 15px 0 7px;
        }

        .student-course p {
            color: var(--muted);
            font-size: 13px;
        }

        .progress {
            height: 7px;
            background: #101d32;
            border-radius: 10px;
            margin: 20px 0 8px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(
                90deg,
                var(--blue),
                var(--cyan)
            );
        }

        .progress-text {
            color: var(--muted);
            font-size: 11px;
        }

        @media(max-width: 800px) {

            .dashboard-grid,
            .course-list {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

    </style>

</head>


<body>

<header class="navbar">

    <div class="container nav-inner">

        <a href="index.html" class="logo">
            <span>&lt;</span>TECH IZACK<span>/&gt;</span>
        </a>

        <button class="btn btn-outline"
                onclick="logout()">

            <i class="fas fa-right-from-bracket"></i>
            Logout

        </button>

    </div>

</header>


<main class="dashboard">

    <div class="container">

        <div class="dashboard-header">

            <div>

                <span class="section-tag">
                    // STUDENT DASHBOARD
                </span>

                <h1>
                    Welcome, <span id="studentName">Student</span>
                </h1>

                <p style="color:var(--muted);">
                    Continue your cybersecurity journey.
                </p>

            </div>

            <div class="user-box">

                <small>Logged in as</small>

                <div id="studentEmail">
                    Loading...
                </div>

            </div>

        </div>


        <div class="dashboard-grid">

            <div class="dashboard-stat">

                <i class="fas fa-book-open"></i>

                <strong id="courseCount">
                    0
                </strong>

                <p>
                    Enrolled Courses
                </p>

            </div>


            <div class="dashboard-stat">

                <i class="fas fa-flask"></i>

                <strong>
                    0
                </strong>

                <p>
                    Labs Completed
                </p>

            </div>


            <div class="dashboard-stat">

                <i class="fas fa-certificate"></i>

                <strong>
                    0
                </strong>

                <p>
                    Certificates
                </p>

            </div>

        </div>


        <h2 class="dashboard-title">
            My Courses
        </h2>

        <div id="courseList"
             class="course-list">

            <p style="color:var(--muted);">
                Loading courses...
            </p>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "WEKA_PROJECT_URL_HAPA";

const SUPABASE_KEY = "WEKA_PUBLISHABLE_KEY_HAPA";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// Check login

async function loadDashboard() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        window.location.href = "index.html";

        return;
    }


    document.getElementById("studentEmail")
        .textContent = user.email;


    const {
        data: profile
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();


    if (profile && profile.full_name) {

        document.getElementById("studentName")
            .textContent = profile.full_name;

    }


    await loadCourses(user.id);
}


// Load courses

async function loadCourses(userId) {

    const {
        data,
        error
    } = await supabaseClient
        .from("enrollments")
        .select(`
            progress,
            courses (
                id,
                title,
                description,
                level,
                lessons,
                labs
            )
        `)
        .eq("user_id", userId);


    if (error) {

        console.error(error);

        return;
    }


    document.getElementById("courseCount")
        .textContent = data.length;


    const list =
        document.getElementById("courseList");


    if (!data.length) {

        list.innerHTML = `
            <p style="color:#8d9bb3;">
                You have not enrolled in any course yet.
            </p>
        `;

        return;
    }


    list.innerHTML = data.map(item => {

        const course = item.courses;

        return `

            <article class="student-course">

                <i class="fas fa-shield-halved"></i>

                <h3>
                    ${course.title}
                </h3>

                <p>
                    ${course.description || ""}
                </p>

                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width:${item.progress}%">
                    </div>

                </div>

                <span class="progress-text">
                    ${item.progress}% completed
                </span>

            </article>

        `;

    }).join("");
}


// Logout

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "index.html";
}


loadDashboard();

</script>

    <script src="../script.js"></script>

</body>
</html>
