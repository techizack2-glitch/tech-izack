```html
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Login | Tech Izack Academy
</title>

<link
rel="stylesheet"
href="style.css">

<style>

.auth-page {

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:30px 20px;

    background:
    radial-gradient(
        circle at top,
        #071a2b,
        #030810 70%
    );

}


.auth-box {

    width:100%;

    max-width:450px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:35px;

}


.auth-logo {

    text-align:center;

    margin-bottom:30px;

}


.auth-logo a {

    font-family:Orbitron;

    font-size:22px;

    color:white;

}


.auth-logo span {

    color:var(--cyan);

}


.form-group {

    margin-bottom:18px;

}


.form-group label {

    display:block;

    margin-bottom:7px;

    color:#9fb2c5;

    font-size:13px;

}


.form-group input {

    width:100%;

    padding:14px;

    background:#050b14;

    color:white;

    border:1px solid var(--border);

    border-radius:6px;

}


.auth-button {

    width:100%;

}


.message {

    display:none;

    margin-top:15px;

    padding:13px;

    border-radius:6px;

}


.message.show {

    display:block;

}


.message.error {

    background:#1a080c;

    border:1px solid #ff6475;

    color:#ff7d8b;

}


.message.success {

    background:#061a14;

    border:1px solid #20d68a;

    color:#20d68a;

}


.links {

    text-align:center;

    margin-top:20px;

}


.links a {

    color:var(--cyan);

}

</style>

</head>


<body>


<main class="auth-page">


<section class="auth-box">


<div class="auth-logo">

<a href="index.html">

<span>&lt;</span>

TECH IZACK

<span>/&gt;</span>

</a>

</div>


<span class="section-tag">

// SECURE LOGIN

</span>


<h1>
Welcome Back
</h1>


<p style="color:var(--muted);">

Login to continue your
cybersecurity training.

</p>


<form id="loginForm">


<div class="form-group">

<label>
Email
</label>

<input
id="email"
type="email"
required
autocomplete="email"
placeholder="you@example.com">

</div>


<div class="form-group">

<label>
Password
</label>

<input
id="password"
type="password"
required
autocomplete="current-password"
placeholder="Your password">

</div>


<button
class="btn btn-primary auth-button"
type="submit">

Login

</button>


<div
id="message"
class="message">

</div>


</form>


<div class="links">

<p>

Don't have an account?

<a href="signup.html">
Create one
</a>

</p>


<p>

<a href="index.html">
← Back to website
</a>

</p>

</div>


</section>

</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>


const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


document
.getElementById(
    "loginForm"
)
.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const email =
            document
            .getElementById(
                "email"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "password"
            )
            .value;


        showMessage(
            "Signing in...",
            "success"
        );


        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email,

                password

            });


        if (error) {

            showMessage(
                error.message,
                "error"
            );

            return;

        }


        if (!data.user) {

            showMessage(
                "Login failed.",
                "error"
            );

            return;

        }


        /*
          Get role from profile.
        */


        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient

            .from("profiles")

            .select("role")

            .eq(
                "id",
                data.user.id
            )

            .single();


        if (profileError) {

            showMessage(
                profileError.message,
                "error"
            );

            return;

        }


        if (
            profile.role ===
            "admin"
        ) {

            location.href =
                "admin.html";

        }

        else {

            location.href =
                "student-dashboard.html";

        }

    }
);


function showMessage(
    text,
    type
) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;


    element.className =
        `message show ${type}`;

}

</script>

</body>

</html>
```
