for successfully completing

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";

const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


async function init() {

    const {
        data: {
            user
        }
    } =
    await supabaseClient.auth
        .getUser();


    if (!user) {

        location.href =
            "login.html";

        return;

    }


    const certificateId =
        new URLSearchParams(
            location.search
        ).get("id");


    if (!certificateId) {

        alert(
            "Certificate ID missing."
        );

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient

        .from("certificates")

        .select(`
            id,
            certificate_number,
            issued_at,
            courses(
                title
            )
        `)

        .eq(
            "id",
            certificateId
        )

        .single();


    if (
        error ||
        !data
    ) {

        alert(
            "Certificate not found."
        );

        return;

    }


    document.getElementById(
        "studentName"
    ).textContent =
        user.user_metadata?.full_name
        ||
        user.email
        ||
        "Student";


    document.getElementById(
        "courseName"
    ).textContent =
        data.courses?.title
        ||
        "Cybersecurity Course";


    document.getElementById(
        "certificateNumber"
    ).textContent =
        `Certificate ID: ${data.certificate_number}`;


    document.getElementById(
        "certificateDate"
    ).textContent =
        `Issued: ${new Date(
            data.issued_at
        ).toLocaleDateString()}`;


    document.getElementById(
        "verifyLink"
    ).href =
        `verify.html?number=${encodeURIComponent(
            data.certificate_number
        )}`;

}


init();

</script>

</body>
