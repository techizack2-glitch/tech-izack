<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification | Tech Izack</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<main style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
">

    <div
        style="
            max-width:600px;
            width:100%;
            padding:40px;
            background:var(--card);
            border:1px solid var(--border);
            border-radius:10px;
            text-align:center;
        "
    >

        <span class="section-tag">
            // CERTIFICATE VERIFICATION
        </span>

        <h1 style="
            font-family:Orbitron;
            margin:20px 0;
        ">

            <span style="color:var(--cyan)">
                VERIFIED
            </span>

        </h1>

        <div id="result">
            Checking certificate...
        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "WEKA_PROJECT_URL_HAPA";

const SUPABASE_KEY =
    "WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function verify() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");


    const result =
        document.getElementById(
            "result"
        );


    if (!id) {

        result.innerHTML =
            "<p>Invalid certificate ID.</p>";

        return;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("certificates")
        .select("*")
        .eq(
            "certificate_id",
            id
        )
        .single();


    if (error || !data) {

        result.innerHTML = `

            <p style="color:#ff6475">
                Certificate not found.
            </p>

        `;

        return;
    }


    result.innerHTML = `

        <div style="
            margin-top:25px;
            line-height:2;
        ">

            <p>
                <strong>Student</strong>
                <br>
                ${escapeHTML(data.student_name)}
            </p>

            <p>
                <strong>Course</strong>
                <br>
                ${escapeHTML(data.course_title)}
            </p>

            <p>
                <strong>Certificate ID</strong>
                <br>
                ${escapeHTML(data.certificate_id)}
            </p>

            <p>
                <strong>Issued</strong>
                <br>
                ${new Date(
                    data.issued_at
                ).toLocaleDateString()}
            </p>

        </div>

    `;

}


function escapeHTML(text) {

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


verify();

</script>

</body>

</html>
