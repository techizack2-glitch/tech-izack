<!DOCTYPE html>

content="width=device-width, initial-scale=1.0">

</title>

rel="stylesheet"
href="style.css">

<style>

.certificate-page {

    min-height:100vh;

    padding:110px 20px 70px;

    display:flex;

    justify-content:center;

    align-items:center;

}

    width:900px;

    max-width:100%;

    padding:55px;

    position:relative;

    background:

        linear-gradient(
            135deg,
            #081827,
            #03070d
        );

    border:2px solid #00d9ff;

    box-shadow:
        0 0 35px
        rgba(0,217,255,.15);

    text-align:center;

}


.certificate::before {

    content:"";

    position:absolute;

    inset:10px;

    border:1px solid
    rgba(32,214,138,.35);

}

.cert-meta {

    display:flex;

    margin-top:35px;

        display:none;

        padding:0;

        box-shadow:none;

    }

</style>

</head>


<body>


<header class="navbar">

<div class="container nav-inner">

<a
href="student-dashboard.html"
class="logo">

<span>&lt;</span>

TECH IZACK

<span>/&gt;</span>

</a>


<a
href="verify.html"
class="btn btn-outline">

Verify Certificate

</a>

</div>

</header>


<main class="certificate-page">


<section class="certificate">


<div class="cert-logo">

TECH IZACK ACADEMY

</div>


<h1 class="cert-title">

CERTIFICATE

</h1>


<p class="cert-subtitle">

OF COMPLETION

</p>


<p>

This certificate is proudly presented to

</p>


<div
id="studentName"
class="student-name">

Loading...

</div>


<p>

for successfully completing

</p>


<div
id="courseName"
class="course-name">

Loading...

<div>

<span id="issuedDate">
-
</span>

<br>

<span

</span>

</div>


</div>


<div class="cert-id">

Certificate ID:
<span id="certificateId">
-
</span>

<div class="actions">

<button
class="btn btn-primary"
onclick="window.print()">

🖨 Print / Save PDF

</button>

</div>


</section>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


async function init() {


    const {
        data
    } =
    await supabaseClient.auth
        .getUser();


    if (!data.user) {

        location.href =
            "login.html";

        return;

    }


    const certificateId =
        new URLSearchParams(
            location.search
        ).get("id");


    if (!certificateId) {

        alert(
            "Certificate ID missing."
        );

        return;

    }


    const {
        data: certificate,
        error
    } =
    await supabaseClient

        .from("certificates")

        .select("*")

        .eq(
            "certificate_id",
            certificateId
        )

        .eq(
            "user_id",
            data.user.id
        )

        .single();


    if (error || !certificate) {

        alert(
            "Certificate not found."
        );

        return;

    }


    document.getElementById(
        "studentName"
    ).textContent =

        certificate.student_name;


    document.getElementById(
        "courseName"
    ).textContent =

        certificate.course_title;


    document.getElementById(
        "certificateId"
    ).textContent =

        certificate.certificate_id;


    document.getElementById(
        "issuedDate"
    ).textContent =

        new Date(
            certificate.issued_at
        ).toLocaleDateString();

}


init();

</script>

</body>

</html>
