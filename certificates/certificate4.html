<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";

const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const params =
new URLSearchParams(
    location.search
);


const certificateId =
params.get("id");


async function init() {

    if (!certificateId) {

        document.getElementById(
            "certificate"
        ).innerHTML = `

            <h2>
                Certificate ID missing.
            </h2>

        `;

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient

        .from("certificates")

        .select(`
            certificate_id,
            student_name,
            course_title,
            score,
            issued_at
        `)

        .eq(
            "certificate_id",
            certificateId
        )

        .single();


    if (
        error ||
        !data
    ) {

        document.getElementById(
            "certificate"
        ).innerHTML = `

            <h2 style="color:#ff6475">

                Certificate Not Found

            </h2>

            <p>
                The certificate ID could not
                be verified.
            </p>

        `;

        return;

    }


    document.getElementById(
        "studentName"
    ).textContent =
        data.student_name;


    document.getElementById(
        "courseName"
    ).textContent =
        data.course_title;


    document.getElementById(
        "certificateId"
    ).textContent =
        data.certificate_id;


    document.getElementById(
        "score"
    ).textContent =
        data.score !== null
        ? `${data.score}%`
        : "Completed";


    const date =
        new Date(
            data.issued_at
        );


    document.getElementById(
        "issuedDate"
    ).textContent =
        date.toLocaleDateString(
            "en-GB",
            {
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        );


    const verifyUrl =
        `${location.origin}/verify.html?id=${encodeURIComponent(
            data.certificate_id
        )}`;


    document.getElementById(
        "verifyLink"
    ).href =
        verifyUrl;


    document.getElementById(
        "verifyLink"
    ).textContent =
        verifyUrl;


    document.getElementById(
        "qrCode"
    ).src =
        "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="
        +
        encodeURIComponent(
            verifyUrl
        );

}


init();

</script>
