src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>


const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


let allTools = [];


async function loadTools() {

    const {
        data,
        error
    } = await supabaseClient

        .from("kali_tools")

        .select("*")

        .eq(
            "published",
            true
        )

        .order(
            "name"
        );


    if (error) {

        document.getElementById(
            "tools"
        ).innerHTML = `

            <p class="no-results">

                ${escapeHTML(
                    error.message
                )}

            </p>

        `;

        return;

    }


    allTools =
        data || [];


    populateCategories();

    renderTools();

}


function populateCategories() {

    const select =
        document.getElementById(
            "category"
        );


    const categories =
        [
            ...new Set(
                allTools.map(
                    tool =>
                    tool.category
                )
            )
        ].sort();


    categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                category;

            option.textContent =
                category;

            select.appendChild(
                option
            );

        }
    );

}


function renderTools() {

    const search =
        document
        .getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const category =
        document
        .getElementById(
            "category"
        )
        .value;


    const level =
        document
        .getElementById(
            "level"
        )
        .value;


    const filtered =
        allTools.filter(
            tool => {

                const matchesSearch =

                    !search ||

                    tool.name
                    .toLowerCase()
                    .includes(search)

                    ||

                    (
                        tool.description ||
                        ""
                    )
                    .toLowerCase()
                    .includes(search);


                const matchesCategory =

                    !category ||

                    tool.category ===
                    category;


                const matchesLevel =

                    !level ||

                    tool.level ===
                    level;


                return (
                    matchesSearch &&
                    matchesCategory &&
                    matchesLevel
                );

            }
        );


    const container =
        document.getElementById(
            "tools"
        );


    if (!filtered.length) {

        container.innerHTML = `

            <p class="no-results">

                No tools found.

            </p>

        `;

        return;

    }


    container.innerHTML =

        filtered.map(
            tool => `

            <article
            class="tool-card">


                <span class="badge">

                    ${escapeHTML(
                        tool.category
                    )}

                </span>


                <h2
                class="tool-name">

                    ${escapeHTML(
                        tool.name
                    )}

                </h2>


                <p
                class="tool-description">

                    ${escapeHTML(
                        tool.description ||
                        ""
                    )}

                </p>


                <div
                class="tool-footer">


                    <span
                    class="badge">

                        ${escapeHTML(
                            tool.level
                        )}

                    </span>


                    <a
                    href="
                    kali-tool.html?id=${tool.id}
                    "
                    class="btn btn-outline">

                        Open Lab →

                    </a>


                </div>


            </article>

            `
        ).join("");

}


document
.getElementById(
    "search"
)
.addEventListener(
    "input",
    renderTools
);


document
.getElementById(
    "category"
)
.addEventListener(
    "change",
    renderTools
);


document
.getElementById(
    "level"
)
.addEventListener(
    "change",
    renderTools
);


function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


loadTools();

</script>
