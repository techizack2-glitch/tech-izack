<script>


const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


let user = null;

let course = null;

let lessons = [];


/*
================================
INITIALIZE
================================
*/

async function init() {


    const {
        data
    } =
    await supabaseClient.auth
        .getUser();


    user =
        data.user;


    if (!user) {

        location.href =
            "login.html";

        return;

    }


    const slug =
        new URLSearchParams(
            location.search
        ).get("slug");


    if (!slug) {

        showError(
            "Course not specified."
        );

        return;

    }


    await loadCourse(
        slug
    );

}


/*
================================
LOAD COURSE
================================
*/

async function loadCourse(
    slug
) {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("courses")

        .select("*")

        .eq(
            "slug",
            slug
        )

        .eq(
            "published",
            true
        )

        .single();


    if (error || !data) {

        showError(
            "Course not found."
        );

        return;

    }


    course =
        data;


    document.getElementById(
        "courseTitle"
    ).textContent =
        course.title;


    document.getElementById(
        "courseDescription"
    ).textContent =
        course.description || "";


    document.getElementById(
        "courseLevel"
    ).textContent =
        course.level;


    await loadLessons();

}


/*
================================
LOAD LESSONS
================================
*/

async function loadLessons() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("lessons")

        .select("*")

        .eq(
            "course_id",
            course.id
        )

        .eq(
            "published",
            true
        )

        .order(
            "lesson_order"
        );


    if (error) {

        showError(
            error.message
        );

        return;

    }


    lessons =
        data || [];


    document.getElementById(
        "lessonCount"
    ).textContent =

        `${lessons.length} Lessons`;


    renderLessons();

    await loadProgress();

}


/*
================================
RENDER LESSONS
================================
*/

function renderLessons() {


    const container =
        document.getElementById(
            "lessons"
        );


    if (!lessons.length) {

        container.innerHTML = `

            <p style="
                color:var(--muted);
            ">

                No lessons available yet.

            </p>

        `;

        return;

    }


    container.innerHTML =

        lessons.map(
            (lesson, index) => `

            <article class="lesson">

                <div
                class="lesson-info">

                    <h3>

                        ${index + 1}.
                        ${escapeHTML(
                            lesson.title
                        )}

                    </h3>

                    <p>

                        ${escapeHTML(
                            lesson.description || ""
                        )}

                    </p>

                </div>


                <a
                href="lesson.html?id=${lesson.id}"
                class="btn btn-outline">

                    Open →

                </a>

            </article>

            `
        ).join("");

}


/*
================================
LOAD PROGRESS
================================
*/

async function loadProgress() {


    const {
        data: completed,
        error
    } =
    await supabaseClient

        .from("lesson_progress")

        .select("lesson_id")

        .eq(
            "user_id",
            user.id
        )

        .eq(
            "completed",
            true
        );


    if (error) {

        console.error(error);

        return;

    }


    const completedIds =
        new Set(
            (completed || [])
            .map(
                item =>
                    item.lesson_id
            )
        );


    const done =
        lessons.filter(
            lesson =>
                completedIds.has(
                    lesson.id
                )
        ).length;


    const total =
        lessons.length;


    const percentage =
        total === 0
        ? 0
        : Math.round(
            done / total * 100
        );


    document.getElementById(
        "progressFill"
    ).style.width =

        `${percentage}%`;


    document.getElementById(
        "progressText"
    ).textContent =

        `${done} of ${total} lessons completed — ${percentage}%`;

}


/*
================================
ERROR
================================
*/

function showError(
    message
) {

    document.body.innerHTML = `

        <div style="
            color:white;
            text-align:center;
            padding:100px 20px;
        ">

            <h1>
                ${escapeHTML(
                    message
                )}
            </h1>

            <a
            href="student-dashboard.html"
            class="btn btn-primary">

                Back to Dashboard

            </a>

        </div>

    `;

}


/*
================================
ESCAPE HTML
================================
*/

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


init();

</script>
