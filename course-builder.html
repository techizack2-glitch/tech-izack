```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

href="style.css">

<style>

.builder-page {
    padding:120px 0 80px;
}

.builder-card {
    max-width:900px;
    margin:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:35px;

    margin-bottom:22px;

.form-group label {
    display:block;

        grid-template-columns:1fr;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
"WEKA_PROJECT_URL_HAPA";


const SUPABASE_KEY =
"WEKA_PUBLISHABLE_KEY_HAPA";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const params =
new URLSearchParams(
    window.location.search
);


const courseId =
params.get("id");


let editing = false;


// ==========================
// AUTH
// ==========================

async function checkAdmin() {

    const {
        data:{user}
    } =
    await supabaseClient
        .auth
        .getUser();


    if (!user) {

        location.href =
        "index.html";

        return false;

    }


    const {
        data:profile
    } =
    await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id",user.id)
        .single();


    if (
        !profile ||
        profile.role !== "admin"
    ) {

        location.href =
        "dashboard.html";

        return false;

    }


    return true;

}


// ==========================
// LOAD COURSE
// ==========================

async function loadCourse() {

    if (!courseId) return;


    editing = true;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("courses")
        .select("*")
        .eq("id",courseId)
        .single();


    if (error || !data) {

        showMessage(
            "Course not found.",
            true
        );

        return;

    }


    document.getElementById(
        "title"
    ).value =
    data.title || "";


    document.getElementById(
        "description"
    ).value =
    data.description || "";


    document.getElementById(
        "level"
    ).value =
    data.level || "Beginner";


    document.getElementById(
        "category"
    ).value =
    data.category || "Kali Linux";


    document.getElementById(
        "thumbnail"
    ).value =
    data.thumbnail_url || "";


    document.getElementById(
        "published"
    ).checked =
    data.published === true;


    document.querySelector(
        "h1"
    ).textContent =
    "Edit Course";


    document.querySelector(
        "#courseForm button"
    ).textContent =
    "Update Course →";


    updatePreview();

}


// ==========================
// SAVE
// ==========================

document
.getElementById("courseForm")
.addEventListener(
"submit",
async function(event) {

    event.preventDefault();


    const title =
    document
        .getElementById("title")
        .value
        .trim();


    const description =
    document
        .getElementById("description")
        .value
        .trim();


    const level =
    document
        .getElementById("level")
        .value;


    const category =
    document
        .getElementById("category")
        .value;


    const thumbnail =
    document
        .getElementById("thumbnail")
        .value
        .trim();


    const published =
    document
        .getElementById("published")
        .checked;


    if (!title) {

        showMessage(
            "Course title is required.",
            true
        );

        return;

    }


    const slug =
    createSlug(title);


    const payload = {

        title,

        slug,

        description,

        level,

        category,

        thumbnail_url:
            thumbnail || null,

        published

    };


    let result;


    if (editing) {

        result =
        await supabaseClient
            .from("courses")
            .update(payload)
            .eq(
                "id",
                courseId
            );

    } else {

        result =
        await supabaseClient
            .from("courses")
            .insert(payload);

    }


    if (result.error) {

        showMessage(
            result.error.message,
            true
        );

        return;

    }


    showMessage(
        editing
        ? "✓ Course updated successfully!"
        : "✓ Course created successfully!",
        false
    );


    if (!editing) {

        setTimeout(
            () => {

                location.href =
                "admin-dashboard.html";

            },
            1000
        );

    }

});


// ==========================
// PREVIEW
// ==========================

document
.getElementById("title")
.addEventListener(
"input",
updatePreview
);


document
.getElementById("description")
.addEventListener(
"input",
updatePreview
);


document
.getElementById("level")
.addEventListener(
"change",
updatePreview
);


document
.getElementById("category")
.addEventListener(
"change",
updatePreview
);


function updatePreview() {

    const title =
    document
        .getElementById("title")
        .value
        .trim();


    const description =
    document
        .getElementById("description")
        .value
        .trim();


    const level =
    document
        .getElementById("level")
        .value;


    const category =
    document
        .getElementById("category")
        .value;


    document.getElementById(
        "previewTitle"
    ).textContent =
    title || "Your Course";


    document.getElementById(
        "previewDescription"
    ).textContent =
    description ||
    "Course description...";


    document.getElementById(
        "previewMeta"
    ).textContent =
    `${level} · ${category}`;

}


// ==========================
// SLUG
// ==========================

function createSlug(text) {

    return text
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );

}


// ==========================

function showMessage(
    text,
    error
) {

    const element =
    document.getElementById(
        "message"
    );


    element.textContent =
    text;


    element.className =
    "message " +
    (
        error
        ? "error"
        : "success"
    );

}


// ==========================

(async()=>{

    const allowed =
    await checkAdmin();


    if (!allowed) return;


    await loadCourse();

})();

</script>

</body>
</html>
